<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">命理 Agent 架构</title>
  <desc id="desc">展示 FastAPI 对话接口、DeepSeek Agent、Redis 会话、本地 bge-m3 知识库与五类工具之间的调用关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FCF9"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#064E3B" flood-opacity="0.09"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 40px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #102A43; }
      .sub { font: 400 18px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #52667A; }
      .stage { font: 700 14px 'Segoe UI',Arial,sans-serif; letter-spacing: 1.3px; fill: #64748B; }
      .head { font: 600 22px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #102A43; }
      .body { font: 400 15px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #52667A; }
      .label { font: 600 16px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #102A43; }
      .small { font: 400 13px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #64748B; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1450" cy="90" r="180" fill="#059669" opacity="0.045"/>
  <text x="56" y="58" class="stage">PROJECT 02 / TOOL-USING AGENT</text>
  <text x="56" y="111" class="title">命理 Agent：让系统判断该调用什么</text>
  <text x="58" y="148" class="sub">FastAPI 承载服务，DeepSeek 负责意图与回答，Redis 保存会话，本地知识库使用 Ollama bge-m3。</text>

  <rect x="48" y="194" width="1504" height="292" rx="26" fill="#FFFFFF" stroke="#D6E8E0" filter="url(#shadow)"/>
  <text x="76" y="230" class="stage">01 / REQUEST &amp; ROUTING</text>
  <text x="76" y="264" class="head">请求进入 Agent</text>

  <rect x="76" y="306" width="210" height="120" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="96" y="338" class="label">用户对话</text>
  <text x="96" y="366" class="body">自然语言问题</text>
  <text x="96" y="391" class="body">可能是多轮对话</text>

  <rect x="330" y="306" width="230" height="120" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="350" y="338" class="label">FastAPI</text>
  <text x="350" y="366" class="body">POST /chat</text>
  <text x="350" y="391" class="body">创建或复用 session_id</text>

  <rect x="604" y="288" width="330" height="156" rx="22" fill="#D1FAE5" stroke="#6EE7B7"/>
  <text x="628" y="323" class="label">DeepSeek Agent</text>
  <text x="628" y="352" class="body">create_openai_tools_agent</text>
  <text x="628" y="378" class="body">判断意图并选择工具</text>
  <text x="628" y="404" class="body">模型：deepseek-flash</text>
  <text x="628" y="428" class="small">工具调用能力已实际验证</text>

  <rect x="978" y="306" width="256" height="120" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="998" y="338" class="label">AgentExecutor</text>
  <text x="998" y="366" class="body">执行工具调用</text>
  <text x="998" y="391" class="body">解析异常自动重试</text>

  <rect x="1278" y="306" width="238" height="120" rx="18" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="1298" y="338" class="label">组织回答</text>
  <text x="1298" y="366" class="body">返回最终答复</text>
  <text x="1298" y="391" class="body">异常时返回兜底信息</text>

  <line x1="286" y1="366" x2="322" y2="366" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="560" y1="366" x2="596" y2="366" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="934" y1="366" x2="970" y2="366" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1234" y1="366" x2="1270" y2="366" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="48" y="522" width="1504" height="286" rx="26" fill="#FFFFFF" stroke="#D6E8E0" filter="url(#shadow)"/>
  <text x="76" y="558" class="stage">02 / TOOLS &amp; MEMORY</text>
  <text x="76" y="592" class="head">能力拆分与上下文</text>

  <rect x="76" y="628" width="266" height="142" rx="18" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="96" y="660" class="label">本地知识库</text>
  <text x="96" y="688" class="body">Chroma + Ollama bge-m3</text>
  <text x="96" y="714" class="body">风水常识检索</text>
  <text x="96" y="740" class="body">Top-k 相关内容</text>

  <rect x="372" y="628" width="226" height="142" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="392" y="660" class="label">八字测算</text>
  <text x="392" y="688" class="body">姓名 + 出生信息</text>
  <text x="392" y="714" class="body">外部工具接口</text>
  <text x="392" y="740" class="body">输入不完整时不执行</text>

  <rect x="628" y="628" width="208" height="142" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="648" y="660" class="label">每日占卜</text>
  <text x="648" y="688" class="body">按意图调用</text>
  <text x="648" y="714" class="body">明确娱乐定位</text>
  <text x="648" y="740" class="body">接口失败可兜底</text>

  <rect x="866" y="628" width="208" height="142" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="886" y="660" class="label">解梦</text>
  <text x="886" y="688" class="body">提取梦境关键词</text>
  <text x="886" y="714" class="body">调用解释工具</text>
  <text x="886" y="740" class="body">返回结构化结果</text>

  <rect x="1104" y="628" width="184" height="142" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1124" y="660" class="label">答案边界</text>
  <text x="1124" y="688" class="body">资料不足时拒答</text>
  <text x="1124" y="714" class="body">不编造事实</text>
  <text x="1124" y="740" class="body">无实时搜索依赖</text>

  <rect x="1318" y="628" width="198" height="142" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1338" y="660" class="label">Redis</text>
  <text x="1338" y="688" class="body">会话历史</text>
  <text x="1338" y="714" class="body">独立 session_id</text>
  <text x="1338" y="740" class="body">TTL 自动过期</text>

  <line x1="769" y1="444" x2="769" y2="620" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="768" y1="604" x2="154" y2="620" stroke="#A7F3D0" stroke-width="2"/>
  <line x1="768" y1="604" x2="485" y2="620" stroke="#A7F3D0" stroke-width="2"/>
  <line x1="768" y1="604" x2="732" y2="620" stroke="#A7F3D0" stroke-width="2"/>
  <line x1="768" y1="604" x2="970" y2="620" stroke="#A7F3D0" stroke-width="2"/>
  <line x1="768" y1="604" x2="1196" y2="620" stroke="#A7F3D0" stroke-width="2"/>
  <line x1="1417" y1="604" x2="1417" y2="620" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="48" y="840" width="730" height="100" rx="22" fill="#102A43"/>
  <text x="76" y="877" class="stage" fill="#6EE7B7">FAILURE BOUNDARY</text>
  <text x="76" y="910" font-family="'Microsoft YaHei','Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">工具失败 → 可理解提示 → 保留日志排查</text>

  <rect x="822" y="840" width="730" height="100" rx="22" fill="#FFFFFF" stroke="#D6E8E0"/>
  <text x="850" y="877" class="stage">PRODUCT BOUNDARY</text>
  <text x="850" y="910" font-family="'Microsoft YaHei','Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="#102A43">交互演示，不构成现实决策建议</text>

  <rect x="48" y="954" width="1504" height="2" rx="1" fill="url(#accent)"/>
</svg>
