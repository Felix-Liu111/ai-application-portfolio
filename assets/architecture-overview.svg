<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用作品集架构总览</title>
  <desc id="desc">左右并列展示 RAG 文档问答与命理 Agent 两条系统链路，底部总结共同的产品化原则。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F7FC"/>
      <stop offset="1" stop-color="#EAF1FB"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 42px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #102A43; }
      .subtitle { font: 400 19px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #52667A; }
      .section { font: 700 26px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #102A43; }
      .kicker { font: 700 14px 'Segoe UI',Arial,sans-serif; letter-spacing: 1.5px; fill: #64748B; }
      .body { font: 400 16px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #52667A; }
      .node-title { font: 600 17px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #102A43; }
      .node-note { font: 400 14px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #64748B; }
      .tag { font: 600 14px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; }
      .caption { font: 500 18px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #334E68; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <circle cx="1465" cy="72" r="150" fill="#2563EB" opacity="0.055"/>
  <circle cx="125" cy="842" r="180" fill="#059669" opacity="0.05"/>

  <text x="56" y="70" class="kicker">AI APPLICATION PORTFOLIO</text>
  <text x="56" y="124" class="title">两个 AI 应用，一条产品化路径</text>
  <text x="58" y="162" class="subtitle">从用户问题出发，把检索、工具、模型与失败边界组织成可理解和可验证的系统。</text>

  <rect x="48" y="205" width="730" height="520" rx="28" fill="#FFFFFF" stroke="#D8E3F0" filter="url(#shadow)"/>
  <rect x="48" y="205" width="10" height="520" rx="5" fill="url(#blue)"/>
  <text x="86" y="248" class="kicker">PROJECT 01</text>
  <text x="86" y="287" class="section">RAG 文档问答</text>
  <text x="86" y="319" class="body">多格式资料接入 · 混合检索 · 查询改写 · 效果评估</text>

  <rect x="86" y="356" width="132" height="76" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="152" y="388" text-anchor="middle" class="node-title">上传文档</text>
  <text x="152" y="412" text-anchor="middle" class="node-note">5 种格式</text>

  <rect x="250" y="356" width="132" height="76" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="316" y="388" text-anchor="middle" class="node-title">加载切分</text>
  <text x="316" y="412" text-anchor="middle" class="node-note">类型感知</text>

  <rect x="414" y="356" width="132" height="76" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="480" y="388" text-anchor="middle" class="node-title">混合检索</text>
  <text x="480" y="412" text-anchor="middle" class="node-note">向量 + BM25</text>

  <rect x="578" y="356" width="156" height="76" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="656" y="388" text-anchor="middle" class="node-title">上下文整理</text>
  <text x="656" y="412" text-anchor="middle" class="node-note">改写 + 过滤</text>

  <line x1="218" y1="394" x2="242" y2="394" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="382" y1="394" x2="406" y2="394" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="546" y1="394" x2="570" y2="394" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="86" y="474" width="310" height="110" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="108" y="506" class="node-title">本地向量：Ollama bge-m3</text>
  <text x="108" y="535" class="node-note">1024 维嵌入，避免占用 DashScope 额度</text>
  <text x="108" y="559" class="node-note">向量库：Chroma</text>

  <rect x="424" y="474" width="310" height="110" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="446" y="506" class="node-title">生成与质量评估</text>
  <text x="446" y="535" class="node-note">DeepSeek 生成回答</text>
  <text x="446" y="559" class="node-note">RAGAS 检查检索与忠实度</text>

  <line x1="480" y1="432" x2="241" y2="466" stroke="#93C5FD" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="656" y1="432" x2="579" y2="466" stroke="#93C5FD" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="86" y="612" width="648" height="76" rx="18" fill="#EFF6FF"/>
  <text x="108" y="643" class="caption">产品价值</text>
  <text x="108" y="670" class="body">让用户更快找到资料、让回答更贴近上下文，并让检索质量可以被检查。</text>

  <rect x="822" y="205" width="730" height="520" rx="28" fill="#FFFFFF" stroke="#D8E3F0" filter="url(#shadow)"/>
  <rect x="1542" y="205" width="10" height="520" rx="5" fill="url(#green)"/>
  <text x="860" y="248" class="kicker">PROJECT 02</text>
  <text x="860" y="287" class="section">命理 Agent</text>
  <text x="860" y="319" class="body">意图判断 · 工具选择 · 多轮会话 · 失败兜底</text>

  <rect x="860" y="356" width="132" height="76" rx="16" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="926" y="388" text-anchor="middle" class="node-title">用户输入</text>
  <text x="926" y="412" text-anchor="middle" class="node-note">自然语言</text>

  <rect x="1024" y="356" width="132" height="76" rx="16" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1090" y="388" text-anchor="middle" class="node-title">FastAPI</text>
  <text x="1090" y="412" text-anchor="middle" class="node-note">请求与会话</text>

  <rect x="1188" y="356" width="132" height="76" rx="16" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1254" y="388" text-anchor="middle" class="node-title">Agent</text>
  <text x="1254" y="412" text-anchor="middle" class="node-note">意图与路由</text>

  <rect x="1352" y="356" width="166" height="76" rx="16" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1435" y="388" text-anchor="middle" class="node-title">组织回答</text>
  <text x="1435" y="412" text-anchor="middle" class="node-note">DeepSeek</text>

  <line x1="992" y1="394" x2="1016" y2="394" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="1156" y1="394" x2="1180" y2="394" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="1320" y1="394" x2="1344" y2="394" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <rect x="860" y="474" width="658" height="110" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="882" y="506" class="node-title">工具层</text>
  <text x="882" y="535" class="node-note">本地风水知识 · 八字测算 · 每日占卜 · 解梦</text>
  <text x="882" y="559" class="node-note">由 Agent 根据用户意图选择，不把规则全部塞进一个提示词</text>

  <rect x="860" y="612" width="310" height="76" rx="18" fill="#ECFDF5"/>
  <text x="882" y="643" class="caption">会话记忆</text>
  <text x="882" y="670" class="body">Redis · 独立 session_id · TTL</text>

  <rect x="1190" y="612" width="328" height="76" rx="18" fill="#ECFDF5"/>
  <text x="1212" y="643" class="caption">边界控制</text>
  <text x="1212" y="670" class="body">异常兜底 · 娱乐定位 · 不作确定性承诺</text>

  <line x1="1254" y1="432" x2="1254" y2="466" stroke="#6EE7B7" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="48" y="766" width="1504" height="102" rx="24" fill="#102A43"/>
  <text x="78" y="806" class="kicker" fill="#93C5FD">COMMON PRODUCT PRINCIPLE</text>
  <text x="78" y="840" font-family="'Microsoft YaHei','Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">先定义问题   →   再设计可解释的路径   →   最后用异常场景与指标验证结果</text>
  <text x="1366" y="840" font-family="'Microsoft YaHei','Segoe UI',Arial,sans-serif" font-size="16" fill="#BCCCDC">刘希 · 2026</text>
</svg>
