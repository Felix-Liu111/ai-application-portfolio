<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">RAG 文档问答架构</title>
  <desc id="desc">展示文档接入、切分、本地 bge-m3 嵌入、混合检索、查询改写、相关性过滤、DeepSeek 生成和 RAGAS 评估的完整链路。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FD"/>
      <stop offset="1" stop-color="#EDF4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <style>
      .title { font: 700 40px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #102A43; }
      .sub { font: 400 18px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #52667A; }
      .stage { font: 700 14px 'Segoe UI',Arial,sans-serif; letter-spacing: 1.3px; fill: #64748B; }
      .head { font: 600 22px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #102A43; }
      .body { font: 400 15px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #52667A; }
      .small { font: 400 13px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #64748B; }
      .label { font: 600 16px 'Microsoft YaHei','Segoe UI',Arial,sans-serif; fill: #102A43; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1468" cy="84" r="180" fill="#2563EB" opacity="0.05"/>
  <text x="56" y="58" class="stage">PROJECT 01 / RAG DOCUMENT QA</text>
  <text x="56" y="111" class="title">RAG 文档问答：让回答回到资料</text>
  <text x="58" y="148" class="sub">DeepSeek 负责生成，Ollama bge-m3 负责本地向量化，Chroma 与 BM25 负责找到相关内容。</text>

  <rect x="48" y="194" width="1504" height="246" rx="26" fill="#FFFFFF" stroke="#D8E3F0" filter="url(#shadow)"/>
  <text x="76" y="230" class="stage">01 / INGEST</text>
  <text x="76" y="264" class="head">文档接入与索引</text>

  <rect x="76" y="296" width="214" height="104" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="96" y="328" class="label">多格式文件</text>
  <text x="96" y="354" class="body">docx · pdf · txt</text>
  <text x="96" y="378" class="body">csv · md</text>

  <rect x="338" y="296" width="214" height="104" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="358" y="328" class="label">类型识别</text>
  <text x="358" y="354" class="body">选择对应 Loader</text>
  <text x="358" y="378" class="body">保留文档来源信息</text>

  <rect x="600" y="296" width="214" height="104" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="620" y="328" class="label">递归切分</text>
  <text x="620" y="354" class="body">chunk_size = 500</text>
  <text x="620" y="378" class="body">chunk_overlap = 200</text>

  <rect x="862" y="296" width="250" height="104" rx="16" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="882" y="328" class="label">Ollama bge-m3</text>
  <text x="882" y="354" class="body">本地生成 1024 维向量</text>
  <text x="882" y="378" class="body">不占用 DashScope 额度</text>

  <rect x="1160" y="296" width="356" height="104" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1180" y="328" class="label">双索引</text>
  <text x="1180" y="354" class="body">Chroma：语义相似</text>
  <text x="1180" y="378" class="body">BM25：关键词精确命中</text>

  <line x1="290" y1="348" x2="330" y2="348" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="552" y1="348" x2="592" y2="348" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="814" y1="348" x2="854" y2="348" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1112" y1="348" x2="1152" y2="348" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="48" y="476" width="1504" height="294" rx="26" fill="#FFFFFF" stroke="#D8E3F0" filter="url(#shadow)"/>
  <text x="76" y="512" class="stage">02 / RETRIEVE &amp; ANSWER</text>
  <text x="76" y="546" class="head">检索、整理与生成</text>

  <rect x="76" y="584" width="210" height="118" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="96" y="616" class="label">用户问题</text>
  <text x="96" y="643" class="body">自然语言提问</text>
  <text x="96" y="667" class="body">可切换模型与参数</text>

  <rect x="332" y="584" width="230" height="118" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="352" y="616" class="label">查询改写</text>
  <text x="352" y="643" class="body">RePhraseQueryRetriever</text>
  <text x="352" y="667" class="body">补足检索表达</text>

  <rect x="608" y="584" width="250" height="118" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="628" y="616" class="label">混合检索</text>
  <text x="628" y="643" class="body">EnsembleRetriever</text>
  <text x="628" y="667" class="body">Chroma + BM25</text>

  <rect x="904" y="584" width="240" height="118" rx="16" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="924" y="616" class="label">相关性过滤</text>
  <text x="924" y="643" class="body">LLMChainFilter</text>
  <text x="924" y="667" class="body">减少无关上下文</text>

  <rect x="1190" y="584" width="326" height="118" rx="16" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="1210" y="616" class="label">DeepSeek 生成</text>
  <text x="1210" y="643" class="body">deepseek-flash / deepseek-v4-pro</text>
  <text x="1210" y="667" class="body">没有依据时明确说明</text>

  <line x1="286" y1="643" x2="324" y2="643" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="562" y1="643" x2="600" y2="643" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="858" y1="643" x2="896" y2="643" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1144" y1="643" x2="1182" y2="643" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="48" y="798" width="730" height="138" rx="24" fill="#102A43"/>
  <text x="76" y="833" class="stage" fill="#93C5FD">03 / EVALUATE</text>
  <text x="76" y="864" font-family="'Microsoft YaHei','Segoe UI',Arial,sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">RAGAS 评估</text>
  <text x="76" y="896" font-family="'Microsoft YaHei','Segoe UI',Arial,sans-serif" font-size="15" fill="#BCCCDC">上下文精度 · 上下文召回 · 忠实度 · 答案相关性</text>

  <rect x="822" y="798" width="730" height="138" rx="24" fill="#FFFFFF" stroke="#D8E3F0"/>
  <text x="850" y="833" class="stage">DESIGN TRADEOFF</text>
  <text x="850" y="864" class="label">当前为什么没有重排？</text>
  <text x="850" y="894" class="body">第三方重排服务免费额度已用完；保留查询改写与相关性过滤维持可运行，后续再验证是否恢复。</text>

  <rect x="48" y="954" width="1504" height="2" rx="1" fill="url(#accent)"/>
</svg>
