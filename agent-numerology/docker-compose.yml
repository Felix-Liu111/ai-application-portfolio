version: '3.8'
services:
  numerology:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379/
    depends_on:
      - redis
    volumes:
      - ./chroma_db:/app/chroma_db
  redis:
    image: redis:latest
    ports:
      - "6380:6379"